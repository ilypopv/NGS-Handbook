[project]
site_name = "NGS Analysis Handbook"
site_url = "https://iliapopov17.github.io/NGS-Handbook/"
site_description = "Cheat-sheets for NGS data analysis: QC, variant calling, pangenomics, phylogenetics, 16S amplicon analysis."
copyright = "Copyright &copy; 2026 <a href=\"https://iliapopov17.github.io/\">Ilia Popov</a>."

extra_css = ["stylesheets/extra.css"]

repo_url = "https://github.com/iliapopov17/NGS-Handbook"
repo_name = "iliapopov17/NGS-Handbook"

plugins = ["search"]

nav = [
  {"Home" = "index.md"},
  {"Quality Control of Raw Data" = "QC/index.md"},
  {"Genomic Variation Analysis" = "VarCall/index.md"},
  {"Whole Genome and Pangenome Analyses" = "Pangenome/index.md"},
  {"Phylogenetics" = [
    "Phylogenetics/index.md",
    "Phylogenetics/04_01_Intro_Trees.md",
    "Phylogenetics/04_02_Mining_Data.md",
    "Phylogenetics/04_03_MSA.md",
    "Phylogenetics/04_04_Trees.md",
    "Phylogenetics/04_05_Root_Date.md",
    "Phylogenetics/04_06_Phylogenomics.md",
    "Phylogenetics/04_07_Visualization_Pro.md",
    "Phylogenetics/04_08_Tanglegram.md",
  ]},
  {"16S Amplicon Analysis" = [
    "16S_amplicon_analysis/index.md",
    "16S_amplicon_analysis/05_01_Introduction.md",
    "16S_amplicon_analysis/05_02_Crohns_disease.md",
    "16S_amplicon_analysis/05_03_Parkinsons_disease.md",
  ]},
]

[project.theme]
name = "material"
custom_dir = "overrides"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"

font.text = "IBM Plex Mono"

features = [
  "navigation.expand",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "content.code.copy",
  "search.highlight",
  "search.suggest",
  "toc.follow"
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Palette toggle for automatic mode (system preference)
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
options.custom_icons = ["overrides/.icons"]

[project.extra.analytics]
provider = "google"
property = "G-4RBMQR50GK"

[[project.extra.social]]
icon = "fontawesome/solid/address-card"
link = "https://iliapopov17.github.io/"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:iljapopov17@gmail.com"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/iliapopov17"
